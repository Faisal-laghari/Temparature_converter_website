<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precision Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="converter-card">
        <h1>Temperature Converter</h1>
        
        <div class="input-group">
            <label for="tempInput">Enter Temperature</label>
            <input type="number" id="tempInput" placeholder="e.g. 25" step="any">
            
            <label for="unitSelect">Input Unit</label>
            <select id="unitSelect">
                <option value="C">Celsius (°C)</option>
                <option value="F">Fahrenheit (°F)</option>
                <option value="K">Kelvin (K)</option>
            </select>
            
            <button id="convertBtn">Convert</button>
        </div>

        <div id="resultArea" class="result-area">
            <p id="errorMessage" class="error hidden"></p>
            <div id="results" class="hidden">
                <div class="result-box">
                    <span class="label">Celsius:</span>
                    <span id="resC" class="value">-</span>
                </div>
                <div class="result-box">
                    <span class="label">Fahrenheit:</span>
                    <span id="resF" class="value">-</span>
                </div>
                <div class="result-box">
                    <span class="label">Kelvin:</span>
                    <span id="resK" class="value">-</span>
                </div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
